[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hiq-score"
version = "0.1.0"
description = "Machine Intelligence Quotient (HIQ) — psychometric scoring for AI forecasting systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["AI evaluation", "psychometrics", "forecasting", "benchmarking", "Brier score"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/drjagadeshselvaraj/hiq-score"
"Bug Tracker" = "https://github.com/drjagadeshselvaraj/hiq-score/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
